name: Claude Code Auto-Fix

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          custom_instructions: |
            After fixing the issue and committing your changes, you MUST create a pull request using the gh CLI.
            Use this command:
            gh pr create --title "<concise title>" --body "Fixes #<issue_number>\n\nGenerated with [Claude Code](https://claude.ai/code)" --head <current_branch> --base main
            Do NOT just leave a "Create PR" link. Actually create the PR.
