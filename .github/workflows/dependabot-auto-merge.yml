name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Approve and merge minor/patch Dependabot PRs
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`,
            });
            if (prs.length === 0) {
              console.log('No open PR found for this branch, skipping');
              return;
            }
            const pr = prs[0];

            // Skip major version bumps (e.g. "from 9.x to 10.x")
            const versionMatch = pr.title.match(/from\s+(\d+)\.\d[\d.]*\s+to\s+(\d+)\.\d/i);
            if (versionMatch && versionMatch[1] !== versionMatch[2]) {
              console.log(`Major version bump (v${versionMatch[1]} → v${versionMatch[2]}), skipping: ${pr.title}`);
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              event: 'APPROVE',
            });

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash',
            });

            console.log(`Merged PR #${pr.number}: ${pr.title}`);
