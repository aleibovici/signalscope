name: Deploy to Cloud Run

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  REPO_NAME: signalscope
  WEB_SERVICE: signalscope-web

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy web to Cloud Run
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${REPO_NAME}/web:latest"
          gcloud run deploy "${WEB_SERVICE}" \
            --image="${IMAGE}" \
            --region="${GCP_REGION}" \
            --add-cloudsql-instances="${GCP_PROJECT_ID}:${GCP_REGION}:signalscope-db" \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,AUTH_SECRET=AUTH_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,BING_SITE_VERIFICATION=BING_SITE_VERIFICATION:latest,RESEND_API_KEY=RESEND_API_KEY:latest,HARVEST_API_KEY=HARVEST_API_KEY:latest,SNAPSHOT_API_KEY=SNAPSHOT_API_KEY:latest,X402_WALLET_ADDRESS=X402_WALLET_ADDRESS:latest" \
            --set-env-vars="NODE_ENV=production,AI_PRIMARY_PROVIDER=openai" \
            --port=3000 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --cpu-boost \
            --allow-unauthenticated \
            --quiet

      - name: Show deployed URL
        run: |
          gcloud run services describe "${WEB_SERVICE}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)'
