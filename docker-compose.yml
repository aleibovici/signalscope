services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: signalscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/signalscope?schema=public
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - db

  harvester:
    build:
      context: .
      dockerfile: Dockerfile.harvester
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/signalscope?schema=public
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - db
    profiles:
      - harvest  # Only run with: docker compose --profile harvest run harvester

volumes:
  pgdata:
